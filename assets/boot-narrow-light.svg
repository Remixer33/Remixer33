<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-label="OMAR_OS boot screen, CORE. Signal detected. Routing: github.com/Remixer33. Power on. Omar Alatas, digital plumber. I connect things that do not talk to each other. [ ok ] all systems.">
<title>OMAR_OS boot screen, CORE. Signal detected. Routing: github.com/Remixer33. Power on. Omar Alatas, digital plumber. I connect things that do not talk to each other. [ ok ] all systems.</title>
<style>
@font-face{font-family:"JBM";font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format("woff")}
@font-face{font-family:"JBM";font-weight:800;font-style:normal;src:url(data:font/woff;base64,) format("woff")}
text{font-family:"JBM", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-weight:400}
.silk{fill:#5f5b54;letter-spacing:.26em}
.boot{fill:#3f6048}
.name{fill:#1a2030;font-weight:800}
.ghost{fill:#8a603f;font-weight:800;opacity:0}
.tag{fill:#5f5b54}
.status{fill:#3f6048}
.caret{fill:#3f6048}
.cover{fill:#ebe6da;transform-box:fill-box;transform-origin:right center;transform:scaleX(0)}
.trace{fill:none;stroke:#8a603f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.pad{fill:#8a603f}
.ring{fill:none;stroke:#8a603f;stroke-width:1.5}
.pop{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@keyframes hold{from{opacity:0}to{opacity:0}}
@keyframes land{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: no-preference){
.a-frame{animation:fade .3s ease-out 0s both}
.a-silk{animation:fade .3s ease-out .1s both}
.a-b1{animation:type .35s steps(17, end) .2s both}
.a-b2{animation:type .55s steps(31, end) .6s both}
.a-b3{animation:type .2s steps(10, end) 1.2s both}
.a-caret{animation:blink .5s steps(1, end) 1.4s 4 both, hold 1.4s linear 0s 1 none}
.a-name{animation:land .4s cubic-bezier(.2,.7,.2,1) 1.5s both}
.a-ghost{animation:flash .12s linear 1.5s 1 none}
.a-trace{animation:draw 1.2s ease-in-out 1.9s both}
.a-pad{animation:pop .2s ease-out 3.1s both}
.a-tail{animation:fade .4s ease-out 3.2s both}
}
</style>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c9c2b3"/></pattern></defs>
<rect x="0.5" y="0.5" width="639" height="559" rx="14" fill="#ebe6da"/>
<g class="a-frame" aria-hidden="true">
<rect x="0.5" y="0.5" width="639" height="559" rx="14" fill="none" stroke="#c9c2b3" stroke-width="1"/>
<rect x="430" y="190" width="186" height="150" fill="url(#dots)" opacity="0.6"/>
</g>
<g class="a-silk" font-size="13">
<text class="silk" x="40" y="40">OMAR_OS</text>
<text class="silk" x="600" y="40" text-anchor="end">CORE</text>
</g>
<text class="boot" x="40" y="88" font-size="22">&gt; signal detected</text>
<text class="boot" x="40" y="118" font-size="22">&gt; routing: github.com/Remixer33</text>
<text class="boot" x="40" y="148" font-size="22">&gt; power on</text>
<rect class="cover a-b1" aria-hidden="true" x="38" y="66" width="228.4" height="28.6"/>
<rect class="cover a-b2" aria-hidden="true" x="38" y="96" width="413.2" height="28.6"/>
<rect class="cover a-b3" aria-hidden="true" x="38" y="126" width="136" height="28.6"/>
<rect class="caret a-caret" x="179" y="131" width="12" height="22"/>
<text class="ghost a-ghost" aria-hidden="true" x="44" y="268" font-size="104" textLength="250" lengthAdjust="spacingAndGlyphs">OMAR</text>
<text class="ghost a-ghost" aria-hidden="true" x="44" y="372" font-size="104" textLength="374" lengthAdjust="spacingAndGlyphs">ALATAS</text>
<text class="name a-name" x="40" y="268" font-size="104" textLength="250" lengthAdjust="spacingAndGlyphs">OMAR</text>
<text class="name a-name" x="40" y="372" font-size="104" textLength="374" lengthAdjust="spacingAndGlyphs">ALATAS</text>
<path class="trace a-trace" d="M40 402 H500 L540 362 H585" pathLength="1"/>
<circle class="pad pop a-pad" cx="592" cy="362" r="7"/>
<circle class="ring pop a-pad" cx="592" cy="362" r="12"/>
<g class="a-tail">
<text class="tag" x="40" y="446" font-size="24">digital plumber.</text>
<text class="tag" x="40" y="476" font-size="24">I connect things that do not</text>
<text class="tag" x="40" y="506" font-size="24">talk to each other.</text>
<text class="status" x="600" y="540" font-size="16" text-anchor="end">[ ok ] all systems</text>
</g>
</svg>
